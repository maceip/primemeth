[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synth"
version = "0.1.0"
description = "Phase 0 package scaffold for the Synth local coding-agent harness"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastembed>=0.4.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
    "sqlite-vec>=0.1.0",
    "tiktoken>=0.8.0",
]

[project.scripts]
synth = "optimizer.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["local_memory", "middleware", "optimizer"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["local_memory", "middleware", "optimizer", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["local_memory", "middleware", "optimizer"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests/harness_regression"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["local_memory", "middleware", "optimizer"]
