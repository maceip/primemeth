[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synth"
version = "0.1.0"
description = "Local control plane for the Synth coding-agent harness"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastembed>=0.4.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
    "sqlite-vec>=0.1.0",
]

[project.scripts]
synth = "synth.cli:main"
synth-bridge = "synth.cli:bridge_main"

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["synth", "local_memory", "middleware", "optimizer"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["synth", "local_memory", "middleware", "optimizer", "tests"]
extend-exclude = ["optimizer/vendor/autosaddler_v2"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["synth", "local_memory", "middleware", "optimizer"]

[tool.ruff.lint.per-file-ignores]
"local_memory/prompts_reasoning_bank.py" = ["E501"]
"middleware/prompts_bats.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests/harness_regression"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["synth", "local_memory", "middleware", "optimizer"]
exclude = "^optimizer/vendor/autosaddler_v2/"

[[tool.mypy.overrides]]
module = "optimizer.vendor.autosaddler_v2.*"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "optimizer.transport"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "optimizer.synth_harness"
disable_error_code = ["no-any-return"]
