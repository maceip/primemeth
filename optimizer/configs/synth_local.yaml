# Credential-free local Phase 6 smoke. The vendored history bundle is bounded
# to 16 candidates, 12 iterations, 32 lessons, 16 current cases, and 256 KiB
# of diff text (64 KiB per diff).
schema_version: autosaddler/v2
scenario:
  type: synth_harness
  settings:
    source_repo: ../..
    base_revision: HEAD
    train_root: ../../tests/harness_tasks/train
    development_root: ../../tests/harness_tasks/dev
    train_case_ids: [train-add, train-slug, train-clamp]
    development_case_ids: [dev-mean, dev-normalize, dev-chunks, dev-backoff]
    seed_skill_file: ../../tests/harness_seed/.prime/agent/skills/synth-harness/SKILL.md
    capability_phase_iterations: 1
    evaluation_timeout_seconds: 30
optimization:
  task_selection:
    type: fixed
    batch_size: 3
  acceptance:
    type: matched_valid_strict_improvement
  development:
    type: full_on_accept
  ranking:
    type: mean_development_score
  budget:
    max_rollouts: 64
    max_iterations: 1
  diagnosis_patch_timeout_seconds: 30
  selection_timeout_seconds: 30
  reflection_timeout_seconds: 30
  session_retries: 0
  session_retry_backoff_seconds: 0
provider:
  type: stub
  capabilities: [read_workspace, edit_workspace, run_commands, load_skills]
  settings:
    target_path: .prime/agent/skills/synth-harness/SKILL.md
    improved_skill_file: ../assets/synth-harness-good.md
storage:
  type: local
  run_root: ../../.synth/optimizer-runs
